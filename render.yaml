services:
  - type: web
    name: trail-companion-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Backend URL, e.g. https://trail-companion-api.onrender.com
      - key: VITE_API_URL
        sync: false
      # Must match FEATURE_REGISTRATION_ENABLED on trail-companion-api. Read at build time: redeploy after changing it.
      - key: FEATURE_REGISTRATION_ENABLED
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://trail-companion-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
